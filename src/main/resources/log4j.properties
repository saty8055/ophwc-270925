# Root logger
log4j.rootLogger=INFO, consoleAppender, fileAppender

# Console appender
log4j.appender.consoleAppender=org.apache.log4j.ConsoleAppender
log4j.appender.consoleAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.consoleAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Application log file
log4j.appender.fileAppender=org.apache.log4j.RollingFileAppender
log4j.appender.fileAppender.File=${catalina.home}/logs/ophwc-application.log
log4j.appender.fileAppender.MaxFileSize=10MB
log4j.appender.fileAppender.MaxBackupIndex=5
log4j.appender.fileAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.fileAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Error log file
log4j.appender.errorAppender=org.apache.log4j.RollingFileAppender
log4j.appender.errorAppender.File=${catalina.home}/logs/ophwc-error.log
log4j.appender.errorAppender.MaxFileSize=10MB
log4j.appender.errorAppender.MaxBackupIndex=5
log4j.appender.errorAppender.Threshold=ERROR
log4j.appender.errorAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.errorAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Named loggers used in the application
log4j.logger.applicationLogger=DEBUG, fileAppender, consoleAppender
log4j.logger.errorLoggger=ERROR, errorAppender, consoleAppender

# Hibernate SQL logging (set to INFO to suppress verbose SQL)
log4j.logger.org.hibernate=INFO
log4j.logger.org.springframework=INFO

